<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowState</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav
      class="sticky top-0 z-10 w-full bg-white/80 border-b border-slate-200 backdrop-blur-md"
    >
      <div
        class="mx-auto max-w-7xl h-16 flex justify-between items-center px-4"
      >
        <div class="flex items-center gap-2">
          <div class="h-8 w-8 bg-blue-600 rounded-lg"></div>
          <span class="text-xl font-bold text-slate-900 tracking-tight"
            >FlowState</span
          >
        </div>
        <div
          class="hidden md:flex items-center space-x-8 text-sm text-slate-600 font-medium"
        >
          <a href="#" class="hover:text-blue-600 transition-colors">Product</a>
          <a href="#" class="hover:text-blue-600 transition-colors"
            >Solutions</a
          >
          <a href="#" class="hover:text-blue-600 transition-colors">Pricing</a>
          <button
            class="bg-blue-600 text-white px-5 py-2 rounded-full shadow-sm shadow-blue-200 hover:bg-blue-700 transition-all"
          >
            Get Started
          </button>
        </div>
        <div data-mobile-open class="md:hidden text-slate-500">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16m-7 6h7"
            />
          </svg>
        </div>
      </div>
    </nav>
    <div
      data-mobile-menu
      class="fixed z-100 inset-0 bg-white opacity-0 pointer-events-none transition-all duration-300"
    >
      <div class="h-full flex flex-col p-4">
        <button data-mobile-close class="self-end p-2 -mr-2">
          <svg
            class="w-6 h-6 text-slate-500"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640"
          >
            <path
              d="M504.6 148.5C515.9 134.9 514.1 114.7 500.5 103.4C486.9 92.1 466.7 93.9 455.4 107.5L320 270L184.6 107.5C173.3 93.9 153.1 92.1 139.5 103.4C125.9 114.7 124.1 134.9 135.4 148.5L278.3 320L135.4 491.5C124.1 505.1 125.9 525.3 139.5 536.6C153.1 547.9 173.3 546.1 184.6 532.5L320 370L455.4 532.5C466.7 546.1 486.9 547.9 500.5 536.6C514.1 525.3 515.9 505.1 504.6 491.5L361.7 320L504.6 148.5z"
              fill="currentColor"
            />
          </svg>
        </button>
        <nav>
          <a
            class="block py-2 text-2xl border-b border-slate-100 font-medium text-slate-800"
            href="#"
            >Product</a
          >
          <a
            class="block py-2 text-2xl border-b border-slate-100 font-medium text-slate-800"
            href="#"
            >Solutions</a
          >
          <a
            class="block py-2 text-2xl border-b border-slate-100 font-medium text-slate-800"
            href="#"
            >Pricing</a
          >
        </nav>
      </div>
    </div>
    <section
      class="bg-white pt-20 pb-16 lg:pt-32 lg:pb-24 overflow-hidden relative"
    >
      <div class="h-full w-full absolute top-0 z-0 pointer-events-none">
        <div
          class="absolute top-[-10%] left-[-15%] w-[60%] h-[60%] bg-blue-50 rounded-full blur-[100px] opacity-70"
        ></div>
        <div
          class="absolute bottom-[0%] right-[-15%] w-[60%] h-[60%] bg-indigo-50 rounded-full blur-[100px] opacity-70"
        ></div>
      </div>
      <div class="max-w-7xl m-auto px-4 sm-6 lg-8 relative z-10">
        <div class="text-center max-w-4xl m-auto">
          <div
            class="inline-flex items-center gap-2 border border-blue-100 rounded-full px-4 py-1.5 text-blue-700 bg-blue-50 text-sm font-semibold mb-8 hover:bg-blue-100 transition-colors cursor-default"
          >
            <span class="h-2 w-2 flex items-center relative">
              <span
                class="inline-flex h-full w-full bg-blue-400 rounded-full animate-ping opacity-75 absolute"
              ></span>
              <span
                class="relative inline-flex h-full w-full bg-blue-600 rounded-full"
              ></span>
            </span>
            New: AI Focus Mode is here
          </div>
          <h1
            class="text-5xl md:text-7xl lg:text-8xl font-black text-slate-900 tracking-tight leading-[1.1] mb-8"
          >
            Master your time with
            <br class="hidden md:block" />
            <span
              class="text-transparent bg-clip-text bg-linear-to-r from-blue-600 to-indigo-500"
              >FlowState</span
            >
          </h1>
          <p
            class="text-lg md:text-xl text-slate-600 max-w-2xl m-auto leading-relaxed mb-12"
          >
            The all-in-one workspace designed for deep work. Stop juggling tabs
            and start reaching your goals with intelligent focus blocks.
          </p>
          <div
            class="flex flex-col sm:flex-row items-center justify-center gap-4"
          >
            <button
              class="group w-full sm:w-auto flex items-center justify-center gap-2 px-8 py-4 text-white text-lg font-bold hover:bg-blue-600 shadow-xl transition-all bg-slate-900 rounded-full active:scale-95"
            >
              Start for Free
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 group-hover:translate-x-1 transition-transform"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 7l5 5m0 0l-5 5m5-5H6"
                />
              </svg>
            </button>
            <button
              class="w-full sm:w-auto bg-white text-slate-900 px-8 py-4 border-2 border-slate-200 text-lg font-bold rounded-full hover:bg-slate-200 hover:border-slate-300 active:scale-95 transition-all"
            >
              Watch Demo
            </button>
          </div>
        </div>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
